
name: Build RC Remote APK

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null

      - name: Verify build environment
        run: |
          java -version
          ./gradlew --version
          sdkmanager --list_installed

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: rc-remote-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Build release APK
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: rc-remote-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Run lint
        if: always()
        run: ./gradlew --no-daemon --stacktrace lint
        continue-on-error: true

      - name: Run unit tests
        if: always()
        run: ./gradlew --no-daemon --stacktrace test
        continue-on-error: true

      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc-remote-build-reports
          path: app/build/reports/
          if-no-files-found: ignore
          retention-days: 7
